<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 115" width="100%" role="img" aria-label="Chapter 01 — THE ENGINEER: who's behind the soldering iron">
  <defs>
    <linearGradient id="chBg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#14090B"/>
      <stop offset="50%" stop-color="#0A0A0A"/>
      <stop offset="100%" stop-color="#120C0F"/>
    </linearGradient>

    <linearGradient id="tipHeat" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E5EE4E"/>
      <stop offset="60%" stop-color="#A21517"/>
      <stop offset="100%" stop-color="#555560"/>
    </linearGradient>

    <filter id="glow1" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <style>
      .mono { font-family: 'JetBrains Mono', 'Fira Code', 'DejaVu Sans Mono', Consolas, 'Courier New', monospace; }
      .sans { font-family: 'Segoe UI', 'DejaVu Sans', Arial, Helvetica, sans-serif; }

      .pulse-line {
        stroke-dasharray: 80 1120;
        animation: lineRun 3.2s linear infinite;
      }
      @keyframes lineRun {
        from { stroke-dashoffset: 1200; }
        to { stroke-dashoffset: 0; }
      }

      .spark-1 { animation: sparkUp 1.8s ease-out infinite; }
      .spark-2 { animation: sparkUp 1.8s ease-out 0.6s infinite; }
      .spark-3 { animation: sparkUp 1.8s ease-out 1.15s infinite; }
      @keyframes sparkUp {
        0% { transform: translate(0, 0) scale(1); opacity: 1; }
        100% { transform: translate(-8px, -24px) scale(0.3); opacity: 0; }
      }

      .heat-glow { animation: heatPulse 2s ease-in-out infinite; }
      @keyframes heatPulse {
        0%, 100% { opacity: 0.55; }
        50% { opacity: 1; }
      }
    </style>
  </defs>

  <rect x="6" y="6" width="1188" height="103" rx="12" fill="url(#chBg)" stroke="#381A1E" stroke-width="1.5"/>

  <!-- Left Chapter Badge -->
  <g transform="translate(24, 21)">
    <rect x="0" y="0" width="72" height="72" rx="10" fill="#A21517"/>
    <circle cx="36" cy="36" r="29" fill="none" stroke="#ECBDD8" stroke-width="1" stroke-dasharray="6 6" opacity="0.75">
      <animateTransform attributeName="transform" type="rotate" from="0 36 36" to="360 36 36" dur="14s" repeatCount="indefinite"/>
    </circle>
    <text x="36" y="47" text-anchor="middle" class="mono" font-size="30" font-weight="800" fill="#FFFFFF">01</text>
  </g>

  <!-- Connecting Trace -->
  <path d="M 96 57 L 124 57 L 136 45 L 152 45" fill="none" stroke="#A21517" stroke-width="2"/>
  <circle cx="152" cy="45" r="3.5" fill="#E5EE4E" filter="url(#glow1)"/>

  <!-- Titles (Clean spacing, zero overlap) -->
  <g transform="translate(174, 42)">
    <text x="0" y="0" class="mono" font-size="11.5" fill="#ECBDD8" letter-spacing="1.8">CHAPTER 01 // PERSONNEL FILE</text>
    <text x="0" y="30" class="sans" font-size="25" font-weight="800" fill="#FFFFFF" letter-spacing="0.6">THE ENGINEER</text>
    <text x="345" y="29" class="mono" font-size="13" fill="#A0A0A8" letter-spacing="0.3">// who's behind the soldering iron</text>
  </g>

  <!-- Right Side: Animated Soldering Iron & Temp Readout -->
  <g transform="translate(936, 18)">
    <rect x="0" y="0" width="238" height="78" rx="8" fill="#0F0F13" stroke="#2D1E22" stroke-width="1.2"/>

    <g transform="translate(22, 16)">
      <path d="M 48 6 L 78 36 L 68 46 L 38 16 Z" fill="#A21517" stroke="#ECBDD8" stroke-width="1"/>
      <path d="M 38 16 L 18 36 L 23 41 L 43 21 Z" fill="#8A8A96"/>
      <path d="M 18 36 L 6 48 L 23 41 Z" fill="url(#tipHeat)" filter="url(#glow1)"/>
      <ellipse cx="6" cy="50" rx="10" ry="3.5" fill="#2A2A32" stroke="#ECBDD8" stroke-width="1"/>
      <circle cx="6" cy="44" r="2.2" fill="#E5EE4E" class="spark-1" filter="url(#glow1)"/>
      <circle cx="10" cy="42" r="1.8" fill="#ECBDD8" class="spark-2" filter="url(#glow1)"/>
      <circle cx="4" cy="41" r="1.6" fill="#E5EE4E" class="spark-3" filter="url(#glow1)"/>
    </g>

    <text x="114" y="30" class="mono" font-size="10.5" fill="#A0A0A8" letter-spacing="0.8">IRON_TEMP</text>
    <text x="114" y="52" class="mono heat-glow" font-size="19" font-weight="700" fill="#E5EE4E">350°C</text>
    <text x="114" y="67" class="mono" font-size="9.5" fill="#ECBDD8" letter-spacing="0.6">● READY TO SOLDER</text>
  </g>

  <!-- Bottom Animated Signal Line -->
  <line x1="24" y1="103" x2="1176" y2="103" stroke="#30181B" stroke-width="2"/>
  <line x1="24" y1="103" x2="1176" y2="103" stroke="#E5EE4E" stroke-width="2.4" class="pulse-line" filter="url(#glow1)"/>
</svg>
