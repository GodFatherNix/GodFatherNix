  <rect class="sweep" x="-120" y="0" width="90" height="144" fill="url(#beam)" opacity=".4"/>
  <!-- Solid-to-translucent left shield keeps heading 100% legible -->
  <rect width="1200" height="144" fill="url(#shield)"/>
  <!-- Framed chapter number badge -->
  <g class="badge">
    <rect x="26" y="26" width="94" height="92" rx="10" fill="#180608" stroke="#A21517" stroke-width="2"/>
    <text x="73" y="54" text-anchor="middle" class="chTag">CH</text>
    <text x="73" y="96" text-anchor="middle" class="chNum">01</text>
    <rect x="136" y="30" width="4" height="84" rx="2" fill="#A21517"/>
  </g>
  <!-- Crisp heading & subtitle -->
  <g clip-path="url(#wipe)">
    <text x="158" y="45" class="lab">CHAPTER 01 //</text>
    <text x="158" y="88" class="ttl">THE ENGINEER</text>
    <text x="158" y="116" class="sub">WHO'S BEHIND THE SOLDERING IRON</text>
  </g>
  <line x1="150" y1="0" x2="150" y2="144" stroke="#E5EE4E" stroke-width="2.5"><animate attributeName="x1" from="150" to="1200" begin=".15s" dur=".75s" fill="freeze" calcMode="spline" keyTimes="0;1" keySplines=".25 .8 .25 1"/><animate attributeName="x2" from="150" to="1200" begin=".15s" dur=".75s" fill="freeze" calcMode="spline" keyTimes="0;1" keySplines=".25 .8 .25 1"/><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.2;.88;1" begin=".12s" dur=".85s" fill="freeze"/></line>
</g>
<rect x="1" y="1" width="1198" height="142" rx="12" fill="none" stroke="#A21517" stroke-opacity=".75" stroke-width="2"/>
</svg>