<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="144" viewBox="0 0 1200 144">
<defs>
  <pattern id="grid" width="40" height="28.8" patternUnits="userSpaceOnUse"><path d="M40 0 H0 V28.8" fill="none" stroke="#2c1012" stroke-width="1"/></pattern>
  <linearGradient id="beam" x1="0" x2="1"><stop offset="0" stop-color="#A21517" stop-opacity="0"/><stop offset=".8" stop-color="#A21517" stop-opacity=".35"/><stop offset="1" stop-color="#E5EE4E" stop-opacity=".8"/></linearGradient>
  <linearGradient id="shield" x1="0" x2="1">
    <stop offset="0" stop-color="#09090C" stop-opacity=".98"/>
    <stop offset=".47" stop-color="#09090C" stop-opacity=".96"/>
    <stop offset=".66" stop-color="#09090C" stop-opacity=".2"/>
    <stop offset="1" stop-color="#09090C" stop-opacity="0"/>
  </linearGradient>
  <clipPath id="c"><rect width="1200" height="144" rx="12"/></clipPath>
  <clipPath id="wipe"><rect x="150" y="0" width="0" height="144"><animate attributeName="width" from="0" to="1040" begin=".15s" dur=".75s" fill="freeze" calcMode="spline" keyTimes="0;1" keySplines=".25 .8 .25 1"/></rect></clipPath>
</defs>
<style>
  .chTag{font:700 12px ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', 'Courier New', monospace;letter-spacing:3px;fill:#ECBDD8}
  .chNum{font:800 38px -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;fill:#E5EE4E}
  .lab{font:700 13px ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', 'Courier New', monospace;letter-spacing:4px;fill:#E5EE4E}
  .ttl{font:800 40px -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;letter-spacing:2px;fill:#FFFFFF}
  .sub{font:600 14px ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', 'Courier New', monospace;letter-spacing:2.5px;fill:#ECBDD8}
  .badge{opacity:0;animation:bIn .5s .05s ease-out forwards}
  @keyframes bIn{from{opacity:0;transform:translateX(-14px)}to{opacity:1;transform:none}}
  .sweep{animation:sw 4.5s 1s linear infinite}
  @keyframes sw{from{transform:translateX(680px)}to{transform:translateX(1420px)}}
</style>
<g clip-path="url(#c)">
  <rect width="1200" height="144" fill="#0A0A0A"/>
  <rect width="1200" height="144" fill="url(#grid)"/>
