<svg xmlns="http://www.w3.org/2000/svg" width="560" height="320" viewBox="0 0 560 320">
<defs>
  <radialGradient id="cone" cx="50%" cy="0%" r="100%"><stop offset="0" stop-color="#A21517" stop-opacity=".55"/><stop offset="1" stop-color="#A21517" stop-opacity="0"/></radialGradient>
  <pattern id="tile" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0 H0 V28" fill="none" stroke="#1d1d1d"/></pattern>
  <filter id="neon" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <clipPath id="room"><rect x="22" y="22" width="516" height="276" rx="7"/></clipPath>
</defs>
<style>
  .t{font:700 13px ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', 'Courier New', monospace;letter-spacing:2px}
  .alarmOn{animation:on 6s infinite}
  @keyframes on{0%,29%{opacity:0}30%,34%{opacity:1}36%{opacity:.2}38%,42%{opacity:1}44%{opacity:.2}46%,50%{opacity:1}52%{opacity:.2}54%,58%{opacity:1}60%{opacity:.2}62%,70%{opacity:1}72%,100%{opacity:0}}
  .armed{animation:arm 6s infinite}
  @keyframes arm{0%,29%{opacity:1}30%,71%{opacity:0}72%,100%{opacity:1}}
  .wave{fill:none;stroke:#E5EE4E;stroke-width:3;stroke-linecap:round;animation:wv .5s infinite;transform-box:fill-box;transform-origin:left center}
  @keyframes wv{from{opacity:1;transform:scale(.6)}to{opacity:0;transform:scale(1.3)}}
</style>
<rect width="560" height="320" rx="14" fill="#0A0A0A"/>
<rect x="20" y="20" width="520" height="280" rx="8" fill="url(#tile)" stroke="#333" stroke-width="2"/>
<text x="36" y="290" class="t" fill="#888">ZONE A · TOP VIEW</text>
<!-- detection cone with sweeping beam -->
<path d="M280 44 L110 300 H450 Z" fill="url(#cone)" opacity=".6"/>
<line x1="280" y1="44" x2="280" y2="300" stroke="#A21517" stroke-width="2" filter="url(#neon)"><animateTransform attributeName="transform" type="rotate" values="-32 280 44;32 280 44;-32 280 44" dur="2.4s" repeatCount="indefinite"/></line>
<!-- PIR sensor -->
<rect x="258" y="22" width="44" height="24" rx="4" fill="#222" stroke="#ECBDD8" stroke-width="2"/>
<circle cx="280" cy="44" r="10" fill="#eee" opacity=".9"/>
<text x="316" y="40" class="t" fill="#ECBDD8">PIR</text>
<!-- intruder -->
<g clip-path="url(#room)"><g><animateTransform attributeName="transform" type="translate" values="-30 0;590 0" dur="6s" repeatCount="indefinite"/>
  <circle cx="0" cy="235" r="15" fill="#d0d0d0"/><circle cx="0" cy="235" r="7" fill="#777"/>
  <ellipse cx="-10" cy="252" rx="5" ry="7" fill="#999"><animate attributeName="cy" values="250;256;250" dur=".5s" repeatCount="indefinite"/></ellipse>
  <ellipse cx="10" cy="252" rx="5" ry="7" fill="#999"><animate attributeName="cy" values="256;250;256" dur=".5s" repeatCount="indefinite"/></ellipse>
</g></g>
<!-- buzzer -->
<g transform="translate(470 60)">
  <circle r="20" fill="#1a1a1a" stroke="#E5EE4E" stroke-width="2"/><circle r="6" fill="#E5EE4E"/>
  <g class="alarmOn"><path class="wave" d="M28 -14 Q38 0 28 14"/><path class="wave" d="M38 -22 Q54 0 38 22" style="animation-delay:.15s"/></g>
</g>
<text x="440" y="104" class="t" fill="#E5EE4E">BUZZER</text>
<!-- status -->
<g class="armed"><rect x="36" y="36" width="176" height="28" rx="4" fill="#0f1f0f" stroke="#3fb950"/><text x="48" y="55" class="t" fill="#3fb950">● STATUS: ARMED</text></g>
<g class="alarmOn"><rect x="36" y="36" width="212" height="28" rx="4" fill="#A21517"/><text x="48" y="55" class="t" fill="#fff">⚠ MOTION DETECTED</text></g>
<rect width="560" height="320" rx="14" fill="#A21517" opacity=".16" class="alarmOn"/>
<rect x="1" y="1" width="558" height="318" rx="14" fill="none" stroke="#A21517" stroke-width="2"/>
</svg>