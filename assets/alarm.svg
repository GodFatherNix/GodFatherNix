<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="480" viewBox="0 0 1200 480">
<defs>
  <filter id="glow" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <filter id="blur" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="14"/></filter>
  <linearGradient id="metal" x1="0" x2="1"><stop offset="0" stop-color="#6a6d78"/><stop offset=".28" stop-color="#f3f4f8"/><stop offset=".6" stop-color="#9da0ab"/><stop offset="1" stop-color="#4b4e58"/></linearGradient>
  <linearGradient id="pawn" x1="0" x2="1"><stop offset="0" stop-color="#f4f5f9"/><stop offset=".55" stop-color="#c2c5cf"/><stop offset="1" stop-color="#70737e"/></linearGradient>
  <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#fff" opacity=".07"/></pattern><linearGradient id="beamG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ff3a3d" stop-opacity=".42"/><stop offset="1" stop-color="#ff3a3d" stop-opacity=".03"/></linearGradient>
  <radialGradient id="tint" cx="52%" cy="55%" r="60%"><stop offset="0" stop-color="#ff2b2e" stop-opacity=".2"/><stop offset="1" stop-color="#ff2b2e" stop-opacity="0"/></radialGradient>
  <clipPath id="card"><rect width="1200" height="480" rx="14"/></clipPath>
