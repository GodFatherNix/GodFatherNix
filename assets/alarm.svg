<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 310" width="100%" role="img" aria-label="Intruder Alarm System — animated schematic">
  <defs>
    <linearGradient id="cardBg1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0B0D"/>
      <stop offset="100%" stop-color="#15090C"/>
    </linearGradient>

    <radialGradient id="alertGlow" cx="78%" cy="52%" r="40%">
      <stop offset="0%" stop-color="#A21517" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#0A0A0A" stop-opacity="0"/>
    </radialGradient>

    <pattern id="schGrid1" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 L 0 20" fill="none" stroke="#18181E" stroke-width="0.7"/>
    </pattern>

    <filter id="glowAlarm" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <style>
      .mono { font-family: 'JetBrains Mono', 'Fira Code', 'DejaVu Sans Mono', Consolas, 'Courier New', monospace; }

      .radar-ring-1 { animation: radarExp 2.2s ease-out infinite; }
      .radar-ring-2 { animation: radarExp 2.2s ease-out 0.7s infinite; }
      .radar-ring-3 { animation: radarExp 2.2s ease-out 1.4s infinite; }
      @keyframes radarExp {
        0% { transform: scale(0.35); opacity: 0.95; }
        100% { transform: scale(1.25); opacity: 0; }
      }

      .blip-move { animation: blipEnter 4.8s ease-in-out infinite; }
      @keyframes blipEnter {
        0%, 10% { transform: translate(-24px, 14px); opacity: 0.25; }
        38%, 72% { transform: translate(0px, 0px); opacity: 1; }
        90%, 100% { transform: translate(-24px, 14px); opacity: 0.25; }
      }

      .current-flow {
        stroke-dasharray: 12 18;
        animation: currFlow 0.85s linear infinite;
      }
      @keyframes currFlow {
        from { stroke-dashoffset: 30; }
        to { stroke-dashoffset: 0; }
      }

      .sound-1 { animation: soundWave 1.2s ease-out infinite; }
      .sound-2 { animation: soundWave 1.2s ease-out 0.35s infinite; }
      .sound-3 { animation: soundWave 1.2s ease-out 0.7s infinite; }
      @keyframes soundWave {
        0% { transform: scale(0.65); opacity: 0.95; }
        100% { transform: scale(1.35); opacity: 0; }
      }

      .alert-flash { animation: aFlash 0.9s steps(2, end) infinite; }
      @keyframes aFlash {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.25; }
      }

      .db-1 { animation: dbBounce 0.6s ease-in-out infinite alternate; }
      .db-2 { animation: dbBounce 0.45s ease-in-out 0.1s infinite alternate; }
      .db-3 { animation: dbBounce 0.7s ease-in-out 0.2s infinite alternate; }
      .db-4 { animation: dbBounce 0.5s ease-in-out 0.15s infinite alternate; }
      @keyframes dbBounce {
        from { transform: scaleY(0.35); }
        to { transform: scaleY(1); }
      }
    </style>
  </defs>

  <!-- Outer Frame -->
  <rect x="4" y="4" width="572" height="302" rx="12" fill="url(#cardBg1)" stroke="#A21517" stroke-width="1.8"/>
  <rect x="6" y="6" width="568" height="298" rx="11" fill="url(#schGrid1)"/>
  <rect x="6" y="6" width="568" height="298" rx="11" fill="url(#alertGlow)"/>

  <!-- Header Bar -->
  <rect x="16" y="14" width="548" height="30" rx="6" fill="#141114" stroke="#33181C" stroke-width="1"/>
  <text x="28" y="33" class="mono" font-size="11" font-weight="700" fill="#ECBDD8" letter-spacing="0.8">SCHEMATIC_01 // PIR_ALARM</text>
  <circle cx="426" cy="29" r="4.5" fill="#A21517" class="alert-flash" filter="url(#glowAlarm)"/>
  <text x="438" y="33" class="mono alert-flash" font-size="10.5" font-weight="700" fill="#E5EE4E">MOTION_DETECTED</text>

  <!-- ZONE 1: PIR MOTION SENSOR (Left) -->
  <g transform="translate(26, 64)">
    <rect x="0" y="0" width="144" height="186" rx="8" fill="#101014" stroke="#361E22" stroke-width="1.2"/>
    <text x="72" y="20" text-anchor="middle" class="mono" font-size="10" fill="#A0A0A8" letter-spacing="0.8">U1 // PIR SENSOR</text>

    <!-- Detection Cone -->
    <path d="M 72 124 L 22 46 Q 72 30 122 46 Z" fill="#ECBDD8" fill-opacity="0.07" stroke="#ECBDD8" stroke-width="0.9" stroke-dasharray="3 3" opacity="0.55"/>

    <!-- Expanding Radar Waves -->
    <g transform="translate(72, 118)">
      <circle cx="0" cy="0" r="46" fill="none" stroke="#ECBDD8" stroke-width="1.6" style="transform-box: fill-box; transform-origin: center;" class="radar-ring-1"/>
      <circle cx="0" cy="0" r="46" fill="none" stroke="#A21517" stroke-width="1.6" style="transform-box: fill-box; transform-origin: center;" class="radar-ring-2"/>
      <circle cx="0" cy="0" r="46" fill="none" stroke="#E5EE4E" stroke-width="1.4" style="transform-box: fill-box; transform-origin: center;" class="radar-ring-3"/>
    </g>

    <!-- Animated Target Blip -->
    <g transform="translate(88, 66)" class="blip-move">
      <circle cx="0" cy="0" r="9" fill="#A21517" fill-opacity="0.35"/>
      <circle cx="0" cy="0" r="4.5" fill="#E5EE4E" filter="url(#glowAlarm)"/>
      <text x="11" y="3" class="mono" font-size="8.5" font-weight="700" fill="#E5EE4E">TARGET</text>
    </g>

    <!-- PIR Fresnel Dome -->
    <path d="M 47 124 A 25 22 0 0 1 97 124 Z" fill="#1C1C23" stroke="#ECBDD8" stroke-width="1.6"/>
    <path d="M 56 124 A 16 14 0 0 1 88 124" fill="none" stroke="#A21517" stroke-width="1.3"/>
    <rect x="40" y="124" width="64" height="18" rx="3" fill="#261317" stroke="#A21517" stroke-width="1.2"/>
    <text x="72" y="136" text-anchor="middle" class="mono" font-size="8.5" fill="#FFFFFF">HC-SR501</text>

    <!-- Pins (Spaced cleanly) -->
    <line x1="44" y1="142" x2="44" y2="160" stroke="#A0A0A8" stroke-width="1.8"/>
    <line x1="72" y1="142" x2="72" y2="160" stroke="#E5EE4E" stroke-width="2"/>
    <line x1="100" y1="142" x2="100" y2="160" stroke="#A0A0A8" stroke-width="1.8"/>
    <text x="44" y="173" text-anchor="middle" class="mono" font-size="8.5" fill="#A0A0A8">VCC</text>
    <text x="72" y="173" text-anchor="middle" class="mono" font-size="8.5" fill="#E5EE4E">OUT</text>
    <text x="100" y="173" text-anchor="middle" class="mono" font-size="8.5" fill="#A0A0A8">GND</text>
  </g>

  <!-- ZONE 2: TRANSISTOR DRIVER SCHEMATIC (Middle) -->
  <g transform="translate(170, 64)">
    <!-- VCC Rail -->
    <line x1="88" y1="22" x2="210" y2="22" stroke="#A21517" stroke-width="2.2"/>
    <circle cx="88" cy="22" r="3.5" fill="#A21517"/>
    <text x="148" y="14" text-anchor="middle" class="mono" font-size="9.5" fill="#ECBDD8">+5V VCC RAIL</text>

    <!-- Base Trace from PIR OUT -->
    <path d="M 0 134 L 34 134" fill="none" stroke="#4D421B" stroke-width="2.6"/>
    <path d="M 0 134 L 34 134" fill="none" stroke="#E5EE4E" stroke-width="2.6" class="current-flow" filter="url(#glowAlarm)"/>

    <!-- Resistor R1 (Zigzag, explicit L) -->
    <path d="M 34 134 L 40 126 L 48 142 L 56 126 L 64 142 L 72 126 L 78 134 L 104 134" fill="none" stroke="#ECBDD8" stroke-width="2" stroke-linejoin="round"/>
    <text x="56" y="116" text-anchor="middle" class="mono" font-size="9" fill="#A0A0A8">R1 10kΩ</text>

    <!-- NPN Transistor Q1 (2N2222) -->
    <g transform="translate(122, 134)">
      <circle cx="0" cy="0" r="21" fill="#131318" stroke="#ECBDD8" stroke-width="1.6"/>
      <line x1="-18" y1="0" x2="-6" y2="0" stroke="#E5EE4E" stroke-width="2"/>
      <line x1="-6" y1="-11" x2="-6" y2="11" stroke="#FFFFFF" stroke-width="2.5"/>
      <line x1="-6" y1="-5" x2="10" y2="-16" stroke="#FFFFFF" stroke-width="2"/>
      <line x1="-6" y1="5" x2="10" y2="16" stroke="#FFFFFF" stroke-width="2"/>
      <polygon points="10,16 3,15 7,10" fill="#E5EE4E"/>
      <text x="0" y="34" text-anchor="middle" class="mono" font-size="9" fill="#ECBDD8">Q1 // NPN</text>
    </g>

    <!-- Collector Path to Buzzer (Explicit L) -->
    <path d="M 132 118 L 132 86 L 226 86" fill="none" stroke="#4A1A1D" stroke-width="2.6"/>
    <path d="M 132 118 L 132 86 L 226 86" fill="none" stroke="#E5EE4E" stroke-width="2.6" class="current-flow" filter="url(#glowAlarm)"/>

    <!-- Emitter to GND -->
    <line x1="132" y1="150" x2="132" y2="176" stroke="#A0A0A8" stroke-width="1.8"/>
    <line x1="120" y1="176" x2="144" y2="176" stroke="#ECBDD8" stroke-width="2"/>
    <line x1="124" y1="181" x2="140" y2="181" stroke="#ECBDD8" stroke-width="1.6"/>
    <line x1="128" y1="186" x2="136" y2="186" stroke="#ECBDD8" stroke-width="1.4"/>
  </g>

  <!-- ZONE 3: PIEZO BUZZER & SOUND WAVES (Right) -->
  <g transform="translate(396, 64)">
    <rect x="0" y="0" width="158" height="186" rx="8" fill="#101014" stroke="#A21517" stroke-width="1.3"/>
    <text x="79" y="20" text-anchor="middle" class="mono" font-size="10" fill="#ECBDD8" letter-spacing="0.8">BZ1 // PIEZO</text>

    <g transform="translate(79, 92)">
      <circle cx="0" cy="0" r="52" fill="none" stroke="#E5EE4E" stroke-width="2" stroke-dasharray="16 10" style="transform-box: fill-box; transform-origin: center;" class="sound-1"/>
      <circle cx="0" cy="0" r="52" fill="none" stroke="#A21517" stroke-width="2" stroke-dasharray="20 12" style="transform-box: fill-box; transform-origin: center;" class="sound-2"/>
      <circle cx="0" cy="0" r="52" fill="none" stroke="#ECBDD8" stroke-width="1.6" stroke-dasharray="12 14" style="transform-box: fill-box; transform-origin: center;" class="sound-3"/>

      <circle cx="0" cy="0" r="30" fill="#1D1114" stroke="#A21517" stroke-width="2.5"/>
      <circle cx="0" cy="0" r="19" fill="#121216" stroke="#E5EE4E" stroke-width="1.5"/>
      <circle cx="0" cy="0" r="6" fill="#E5EE4E" class="alert-flash" filter="url(#glowAlarm)"/>
    </g>

    <line x1="79" y1="62" x2="79" y2="28" stroke="#A21517" stroke-width="1.8" stroke-dasharray="3 3"/>

    <!-- Mini dB Audio Bars -->
    <g transform="translate(36, 150)">
      <text x="0" y="18" class="mono" font-size="9" fill="#A0A0A8">2.4kHz</text>
      <rect x="48" y="4" width="6" height="16" rx="1.5" fill="#A21517" style="transform-box: fill-box; transform-origin: bottom;" class="db-1"/>
      <rect x="58" y="2" width="6" height="18" rx="1.5" fill="#E5EE4E" style="transform-box: fill-box; transform-origin: bottom;" class="db-2"/>
      <rect x="68" y="0" width="6" height="20" rx="1.5" fill="#ECBDD8" style="transform-box: fill-box; transform-origin: bottom;" class="db-3"/>
      <rect x="78" y="5" width="6" height="15" rx="1.5" fill="#E5EE4E" style="transform-box: fill-box; transform-origin: bottom;" class="db-4"/>
    </g>
  </g>

  <!-- Footer Telemetry Bar (Separate text nodes, zero tspan overlap) -->
  <rect x="16" y="262" width="548" height="30" rx="6" fill="#120E10" stroke="#33181C" stroke-width="1"/>
  <text x="28"  y="281" class="mono" font-size="10" fill="#A0A0A8">V_TRIG:</text>
  <text x="78"  y="281" class="mono" font-size="10" font-weight="700" fill="#E5EE4E">3.3V</text>
  <text x="122" y="281" class="mono" font-size="10" fill="#555560">|</text>
  <text x="142" y="281" class="mono" font-size="10" fill="#A0A0A8">LOAD:</text>
  <text x="180" y="281" class="mono" font-size="10" font-weight="700" fill="#ECBDD8">BUZZER 85dB</text>
  <text x="276" y="281" class="mono" font-size="10" fill="#555560">|</text>
  <text x="296" y="281" class="mono" font-size="10" fill="#A0A0A8">STATE:</text>
  <text x="342" y="281" class="mono" font-size="10" font-weight="700" fill="#FFFFFF">RUNNING</text>
</svg>
