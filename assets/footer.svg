<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300">
<defs>
  <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0A0A0A"/><stop offset=".22" stop-color="#0A0A0A" stop-opacity="0"/><stop offset=".78" stop-color="#0A0A0A" stop-opacity="0"/><stop offset="1" stop-color="#0A0A0A"/></linearGradient>
  <radialGradient id="glow" cx="50%" cy="100%" r="70%"><stop offset="0" stop-color="#A21517" stop-opacity=".5"/><stop offset="1" stop-color="#A21517" stop-opacity="0"/></radialGradient>
  <clipPath id="c"><rect width="1200" height="300" rx="16"/></clipPath>
</defs>
<style>
  .role{font:700 12px ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', 'Courier New', monospace;letter-spacing:5px;fill:#E5EE4E}
  .name{font:700 20px -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;letter-spacing:1.5px;fill:#fff}
  .end{font:800 34px -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;letter-spacing:4px;fill:#fff}
  .eot{font:700 13px ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', 'Courier New', monospace;letter-spacing:6px;fill:#ECBDD8}
</style>
<g clip-path="url(#c)" text-anchor="middle">
  <rect width="1200" height="300" fill="#0A0A0A"/>
  <rect width="1200" height="300" fill="url(#glow)"/>
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 320;0 -292;0 -292" keyTimes="0;.78;1" dur="18s" repeatCount="indefinite"/>
    <text x="600" y="0" class="role">DIRECTED &amp; SOLDERED BY</text><text x="600" y="24" class="name">KANISHK</text><text x="600" y="56" class="role">PCB LAYOUT</text><text x="600" y="80" class="name">KiCad · EasyEDA</text><text x="600" y="112" class="role">FIRMWARE</text><text x="600" y="136" class="name">Arduino · C · C++</text><text x="600" y="168" class="role">SCRIPTS</text><text x="600" y="192" class="name">Python</text><text x="600" y="224" class="role">VERSION CONTROL</text><text x="600" y="248" class="name">Git</text><text x="600" y="280" class="role">STUNT COMPONENTS</text><text x="600" y="304" class="name">Sensors · Relays · Buzzers · Motors</text><text x="600" y="336" class="role">SPECIAL THANKS</text><text x="600" y="360" class="name">Every circuit that failed the first time</text>
    <text x="600" y="442" class="end">ONE PROJECT AT A TIME.</text>
    <text x="600" y="472" class="eot">[ END OF TRANSMISSION ]</text>
  </g>
  <rect width="1200" height="300" fill="url(#fade)"/>
  <rect x="0" y="0" width="1200" height="26" fill="#000"/>
  <rect x="0" y="274" width="1200" height="26" fill="#000"/>
  <line x1="0" y1="26" x2="1200" y2="26" stroke="#A21517" stroke-opacity=".5"/>
  <line x1="0" y1="274" x2="1200" y2="274" stroke="#A21517" stroke-opacity=".5"/>
</g>
</svg>