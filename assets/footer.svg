<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 140" width="100%" role="img" aria-label="End credits — One project at a time.">
  <defs>
    <linearGradient id="footBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A0A0A"/>
      <stop offset="50%" stop-color="#14080A"/>
      <stop offset="100%" stop-color="#0A0A0A"/>
    </linearGradient>

    <linearGradient id="waveGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#A21517" stop-opacity="0"/>
      <stop offset="25%" stop-color="#A21517" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#ECBDD8" stop-opacity="1"/>
      <stop offset="75%" stop-color="#E5EE4E" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#E5EE4E" stop-opacity="0"/>
    </linearGradient>

    <filter id="glowFoot" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <style>
      .mono { font-family: 'JetBrains Mono', 'Fira Code', 'DejaVu Sans Mono', Consolas, 'Courier New', monospace; }
      .sans { font-family: 'Segoe UI', 'DejaVu Sans', Arial, Helvetica, sans-serif; }

      .wave-run {
        stroke-dasharray: 220 980;
        animation: wRun 4s linear infinite;
      }
      @keyframes wRun {
        from { stroke-dashoffset: 1200; }
        to { stroke-dashoffset: 0; }
      }

      .heart-beat {
        animation: hBeat 2s ease-in-out infinite;
      }
      @keyframes hBeat {
        0%, 100% { opacity: 0.4; }
        50% { opacity: 1; }
      }
    </style>
  </defs>

  <rect x="6" y="6" width="1188" height="128" rx="14" fill="url(#footBg)" stroke="#A21517" stroke-width="1.6"/>

  <!-- Subtle Background Sine Wave -->
  <path d="M 30 70 Q 95 24, 160 70 T 290 70 T 420 70 T 550 70 T 680 70 T 810 70 T 940 70 T 1070 70 T 1170 70"
        fill="none" stroke="#30181C" stroke-width="1.8"/>
  <path d="M 30 70 Q 95 24, 160 70 T 290 70 T 420 70 T 550 70 T 680 70 T 810 70 T 940 70 T 1070 70 T 1170 70"
        fill="none" stroke="url(#waveGrad)" stroke-width="2.4" class="wave-run" filter="url(#glowFoot)"/>

  <!-- Center Credits Box (Generous width) -->
  <rect x="270" y="22" width="660" height="96" rx="10" fill="#0B0B0D" fill-opacity="0.92" stroke="#33191D" stroke-width="1.2"/>

  <text x="600" y="50" text-anchor="middle" class="mono" font-size="11.5" fill="#ECBDD8" letter-spacing="1.8">END CREDITS // KANISHK · GODFATHERNIX</text>
  <text x="600" y="82" text-anchor="middle" class="sans" font-size="22" font-weight="800" fill="#FFFFFF" letter-spacing="2">ONE PROJECT AT A TIME.</text>
  <text x="600" y="104" text-anchor="middle" class="mono" font-size="10.5" fill="#A0A0A8" letter-spacing="1.6">BUILD · TEST · DEBUG · REPEAT</text>

  <!-- Flanking Status Indicators -->
  <g transform="translate(56, 70)">
    <circle cx="0" cy="0" r="5" fill="#A21517" class="heart-beat" filter="url(#glowFoot)"/>
    <text x="16" y="4" class="mono" font-size="10.5" fill="#A0A0A8" letter-spacing="1">EOS // EOF</text>
  </g>
  <g transform="translate(1144, 70)">
    <circle cx="0" cy="0" r="5" fill="#E5EE4E" class="heart-beat" filter="url(#glowFoot)"/>
    <text x="-16" y="4" text-anchor="end" class="mono" font-size="10.5" fill="#ECBDD8" letter-spacing="1">STANDBY</text>
  </g>

  <!-- Corner Brackets -->
  <g fill="none" stroke="#ECBDD8" stroke-width="1.8" opacity="0.7">
    <path d="M 18 32 L 18 18 L 32 18"/>
    <path d="M 1168 18 L 1182 18 L 1182 32"/>
    <path d="M 18 108 L 18 122 L 32 122"/>
    <path d="M 1168 122 L 1182 122 L 1182 108"/>
  </g>
</svg>
