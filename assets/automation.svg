<svg xmlns="http://www.w3.org/2000/svg" width="560" height="320" viewBox="0 0 560 320">
<defs>
  <filter id="neon" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <clipPath id="la"><rect x="20" y="240" width="520" height="60"/></clipPath>
</defs>
<style>
  .t{font:700 13px ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', 'Courier New', monospace;letter-spacing:2px}
  .wire{fill:none;stroke:#444;stroke-width:3}
  .sig{fill:none;stroke:#E5EE4E;stroke-width:3;stroke-dasharray:10 18;animation:flow .8s linear infinite;filter:url(#neon)}
  @keyframes flow{to{stroke-dashoffset:-28}}
  .arm{animation:sw 2s infinite;transform-origin:250px 120px}
  @keyframes sw{0%,49%{transform:rotate(-18deg)}50%,100%{transform:rotate(0)}}
  .led{animation:led 2s infinite}
  @keyframes led{0%,49%{opacity:.15}50%,100%{opacity:1}}
  .gear{animation:spin 3s linear infinite;transform-origin:450px 120px}
  @keyframes spin{to{transform:rotate(360deg)}}
</style>
<rect width="560" height="320" rx="14" fill="#0A0A0A"/>
<!-- MCU -->
<rect x="40" y="70" width="110" height="100" rx="6" fill="#0d2a3a" stroke="#00979D" stroke-width="2"/>
<rect x="52" y="62" width="8" height="10" fill="#bbb"/><rect x="52" y="168" width="8" height="10" fill="#bbb"/><rect x="68" y="62" width="8" height="10" fill="#bbb"/><rect x="68" y="168" width="8" height="10" fill="#bbb"/><rect x="84" y="62" width="8" height="10" fill="#bbb"/><rect x="84" y="168" width="8" height="10" fill="#bbb"/><rect x="100" y="62" width="8" height="10" fill="#bbb"/><rect x="100" y="168" width="8" height="10" fill="#bbb"/><rect x="116" y="62" width="8" height="10" fill="#bbb"/><rect x="116" y="168" width="8" height="10" fill="#bbb"/><rect x="132" y="62" width="8" height="10" fill="#bbb"/><rect x="132" y="168" width="8" height="10" fill="#bbb"/>
<text x="95" y="115" class="t" fill="#00e1ea" text-anchor="middle">MCU</text>
<text x="95" y="135" class="t" fill="#9bd8dc" text-anchor="middle" style="font-size:11px">D7 → HIGH</text>
<!-- wire to relay -->
<path class="wire" d="M150 120 H215"/><path class="sig" d="M150 120 H215"/>
<!-- relay -->
<rect x="215" y="70" width="110" height="100" rx="6" fill="#141414" stroke="#ECBDD8" stroke-width="2"/>
<path d="M232 90 q6 -8 12 0 q6 8 12 0 q6 -8 12 0" fill="none" stroke="#ECBDD8" stroke-width="2"/>
<circle cx="250" cy="120" r="4" fill="#ECBDD8"/><circle cx="300" cy="120" r="4" fill="#ECBDD8"/>
<line class="arm" x1="250" y1="120" x2="298" y2="120" stroke="#E5EE4E" stroke-width="4" stroke-linecap="round"/>
<text x="270" y="158" class="t" fill="#ECBDD8" text-anchor="middle">RELAY</text>
<!-- wire to motor -->
<path class="wire" d="M325 120 H400"/><path class="sig led" d="M325 120 H400"/>
<!-- motor gear -->
<g class="gear"><path d="M488 120 L497.9 123.8 L496.7 131.2 L486.1 131.7 L482.9 139 L489.6 147.2 L484.8 153 L475.4 148.2 L469 152.9 L470.7 163.3 L463.6 166 L457.9 157.2 L450 158 L446.2 167.9 L438.8 166.7 L438.3 156.1 L431 152.9 L422.8 159.6 L417 154.8 L421.8 145.4 L417.1 139 L406.7 140.7 L404 133.6 L412.8 127.9 L412 120 L402.1 116.2 L403.3 108.8 L413.9 108.3 L417.1 101 L410.4 92.8 L415.2 87 L424.6 91.8 L431 87.1 L429.3 76.7 L436.4 74 L442.1 82.8 L450 82 L453.8 72.1 L461.2 73.3 L461.7 83.9 L469 87.1 L477.2 80.4 L483 85.2 L478.2 94.6 L482.9 101 L493.3 99.3 L496 106.4 L487.2 112.1 Z" fill="#1a1a1a" stroke="#A21517" stroke-width="2.5"/><circle cx="450" cy="120" r="14" fill="#0A0A0A" stroke="#A21517" stroke-width="2.5"/><line x1="450" y1="92" x2="450" y2="106" stroke="#A21517" stroke-width="3"/></g>
<text x="450" y="200" class="t" fill="#ff5a5c" text-anchor="middle">MOTOR</text>
<!-- LED -->
<circle cx="270" cy="210" r="9" fill="#E5EE4E" class="led" filter="url(#neon)"/>
<text x="290" y="215" class="t" fill="#bbb">LOAD ACTIVE</text>
<text x="40" y="215" class="t" fill="#888">CTRL LOOP · 0.5Hz</text>
<!-- logic analyzer -->
<rect x="20" y="240" width="520" height="60" rx="6" fill="#0d0d0d" stroke="#222"/>
<g clip-path="url(#la)"><path d="M0 280 V262 H40 V280 H80 V262 H120 V280 H160 V262 H200 V280 H240 V262 H280 V280 H320 V262 H360 V280 H400 V262 H440 V280 H480 V262 H520 V280 H560 V262 H600 V280 H640 V262 H680 V280 H720 V262 H760 V280 H800 V262 H840 V280 H880 V262 H920 V280 H960 V262 H1000 V280 H1040 V262 H1080 V280 H1120 V262 H1160 V280 H1200" fill="none" stroke="#3fb950" stroke-width="2"><animateTransform attributeName="transform" type="translate" from="0 0" to="-80 0" dur="1s" repeatCount="indefinite"/></path></g>
<text x="30" y="256" class="t" fill="#3fb950" style="font-size:10px">CH0</text>
<rect x="1" y="1" width="558" height="318" rx="14" fill="none" stroke="#A21517" stroke-width="2"/>
</svg>