<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 310" width="100%" role="img" aria-label="Automation and Control — animated Arduino, Relay, and Motor schematic">
  <defs>
    <linearGradient id="cardBg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0B0D"/>
      <stop offset="100%" stop-color="#140A0E"/>
    </linearGradient>

    <radialGradient id="motorGlow" cx="80%" cy="50%" r="40%">
      <stop offset="0%" stop-color="#E5EE4E" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#0A0A0A" stop-opacity="0"/>
    </radialGradient>

    <pattern id="schGrid2" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 L 0 20" fill="none" stroke="#18181E" stroke-width="0.7"/>
    </pattern>

    <filter id="glowAuto" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <style>
      .mono { font-family: 'JetBrains Mono', 'Fira Code', 'DejaVu Sans Mono', Consolas, 'Courier New', monospace; }

      .sig-flow {
        stroke-dasharray: 10 16;
        animation: sFlow 0.9s linear infinite;
      }
      .pwr-flow {
        stroke-dasharray: 14 14;
        animation: sFlow 0.65s linear infinite;
      }
      @keyframes sFlow {
        from { stroke-dashoffset: 28; }
        to { stroke-dashoffset: 0; }
      }

      .tx-blink { animation: txB 0.7s steps(2, end) infinite; }
      @keyframes txB {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.25; }
      }

      .coil-pulse { animation: coilGlow 2.4s ease-in-out infinite; }
      @keyframes coilGlow {
        0%, 100% { opacity: 0.55; }
        50% { opacity: 1; }
      }
    </style>
  </defs>

  <!-- Outer Frame -->
  <rect x="4" y="4" width="572" height="302" rx="12" fill="url(#cardBg2)" stroke="#A21517" stroke-width="1.8"/>
  <rect x="6" y="6" width="568" height="298" rx="11" fill="url(#schGrid2)"/>
  <rect x="6" y="6" width="568" height="298" rx="11" fill="url(#motorGlow)"/>

  <!-- Header Bar -->
  <rect x="16" y="14" width="548" height="30" rx="6" fill="#141114" stroke="#33181C" stroke-width="1"/>
  <text x="28" y="33" class="mono" font-size="11" font-weight="700" fill="#ECBDD8" letter-spacing="0.8">SCHEMATIC_02 // AUTOMATION_CTRL</text>
  <circle cx="446" cy="29" r="4.2" fill="#E5EE4E" class="tx-blink" filter="url(#glowAuto)"/>
  <text x="458" y="33" class="mono" font-size="10.5" font-weight="700" fill="#E5EE4E">RELAY: ACTIVE</text>

  <!-- ZONE 1: ARDUINO MCU (Left) -->
  <g transform="translate(26, 64)">
    <rect x="0" y="0" width="146" height="186" rx="8" fill="#101015" stroke="#ECBDD8" stroke-width="1.3"/>
    <rect x="-4" y="28" width="14" height="28" rx="2" fill="#2A2A32" stroke="#A0A0A8" stroke-width="1.2"/>
    <text x="73" y="22" text-anchor="middle" class="mono" font-size="10.5" font-weight="700" fill="#FFFFFF" letter-spacing="0.8">ARDUINO MCU</text>

    <!-- MCU IC Chip -->
    <rect x="30" y="44" width="86" height="46" rx="4" fill="#1B1B22" stroke="#A21517" stroke-width="1.4"/>
    <text x="73" y="64" text-anchor="middle" class="mono" font-size="9" fill="#ECBDD8">ATMEGA328P</text>
    <text x="73" y="79" text-anchor="middle" class="mono" font-size="8.5" fill="#E5EE4E">PIN D7: HIGH</text>

    <!-- LEDs -->
    <circle cx="30" cy="112" r="4" fill="#E5EE4E" filter="url(#glowAuto)"/>
    <text x="40" y="115" class="mono" font-size="8.5" fill="#A0A0A8">PWR</text>
    <circle cx="86" cy="112" r="4" fill="#A21517" class="tx-blink" filter="url(#glowAuto)"/>
    <text x="96" y="115" class="mono" font-size="8.5" fill="#ECBDD8">TX</text>

    <!-- Mini PWM Signal Box (Explicit L commands) -->
    <rect x="16" y="130" width="114" height="40" rx="5" fill="#0B0B0E" stroke="#2D2D36" stroke-width="1"/>
    <path d="M 24 158 L 36 158 L 36 142 L 52 142 L 52 158 L 68 158 L 68 142 L 84 142 L 84 158 L 100 158 L 100 142 L 118 142 L 118 158" fill="none" stroke="#4D481B" stroke-width="1.8"/>
    <path d="M 24 158 L 36 158 L 36 142 L 52 142 L 52 158 L 68 158 L 68 142 L 84 142 L 84 158 L 100 158 L 100 142 L 118 142 L 118 158" fill="none" stroke="#E5EE4E" stroke-width="1.8" class="sig-flow"/>
    <text x="124" y="140" text-anchor="end" class="mono" font-size="7.5" fill="#A0A0A8">PWM</text>
  </g>

  <!-- Wire: Arduino D7 -> Relay Coil (Explicit L) -->
  <path d="M 172 156 L 214 156" fill="none" stroke="#4D421B" stroke-width="2.6"/>
  <path d="M 172 156 L 214 156" fill="none" stroke="#E5EE4E" stroke-width="2.6" class="sig-flow" filter="url(#glowAuto)"/>
  <text x="193" y="148" text-anchor="middle" class="mono" font-size="8.5" fill="#E5EE4E">D7</text>

  <!-- ZONE 2: ELECTROMECHANICAL RELAY (Center) -->
  <g transform="translate(214, 64)">
    <rect x="0" y="0" width="144" height="186" rx="8" fill="#101014" stroke="#A21517" stroke-width="1.4" stroke-dasharray="6 4"/>
    <text x="72" y="20" text-anchor="middle" class="mono" font-size="10" fill="#ECBDD8" letter-spacing="0.8">RLY1 // 5V SPDT</text>

    <!-- Relay Coil -->
    <g transform="translate(24, 92)">
      <rect x="-8" y="-14" width="60" height="46" rx="5" fill="#1B0E11" stroke="#A21517" stroke-width="1.2" class="coil-pulse"/>
      <path d="M 0 18 C 0 4, 12 4, 12 18 C 12 4, 24 4, 24 18 C 24 4, 36 4, 36 18 C 36 4, 48 4, 48 18" fill="none" stroke="#E5EE4E" stroke-width="2.2" filter="url(#glowAuto)"/>
      <text x="24" y="45" text-anchor="middle" class="mono" font-size="8.5" fill="#A0A0A8">COIL 5V</text>
      <line x1="24" y1="-16" x2="24" y2="-32" stroke="#ECBDD8" stroke-width="1.3" stroke-dasharray="3 3" class="coil-pulse"/>
    </g>

    <!-- Mechanical Switch Contacts -->
    <g transform="translate(22, 52)">
      <circle cx="14" cy="14" r="4.5" fill="#ECBDD8"/>
      <text x="14" y="3" text-anchor="middle" class="mono" font-size="8" fill="#A0A0A8">COM</text>
      <circle cx="88" cy="14" r="4.5" fill="#E5EE4E" filter="url(#glowAuto)"/>
      <text x="88" y="3" text-anchor="middle" class="mono" font-size="8" fill="#E5EE4E">NO</text>
      <line x1="14" y1="14" x2="86" y2="14" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round">
        <animateTransform attributeName="transform" type="rotate" values="-18 14 14; 0 14 14; 0 14 14; -18 14 14" keyTimes="0; 0.22; 0.80; 1" dur="2.8s" repeatCount="indefinite"/>
      </line>
    </g>

    <line x1="36" y1="66" x2="36" y2="176" stroke="#A21517" stroke-width="1.8" stroke-dasharray="3 3"/>
    <text x="72" y="174" text-anchor="middle" class="mono" font-size="9" fill="#ECBDD8">+12V LOAD RAIL</text>
  </g>

  <!-- Wire: Relay NO -> Motor (Explicit L) -->
  <path d="M 324 130 L 400 130" fill="none" stroke="#4D1A1D" stroke-width="2.8"/>
  <path d="M 324 130 L 400 130" fill="none" stroke="#E5EE4E" stroke-width="2.8" class="pwr-flow" filter="url(#glowAuto)"/>
  <text x="378" y="122" text-anchor="middle" class="mono" font-size="8.5" fill="#D92628" font-weight="700">12V</text>

  <!-- ZONE 3: DC MOTOR / ROTOR (Right) -->
  <g transform="translate(400, 64)">
    <rect x="0" y="0" width="154" height="186" rx="8" fill="#101014" stroke="#ECBDD8" stroke-width="1.3"/>
    <text x="77" y="20" text-anchor="middle" class="mono" font-size="10" fill="#FFFFFF" letter-spacing="0.8">M1 // DC MOTOR</text>

    <g transform="translate(77, 94)">
      <circle cx="0" cy="0" r="46" fill="#16161C" stroke="#A21517" stroke-width="3"/>
      <circle cx="0" cy="0" r="38" fill="none" stroke="#ECBDD8" stroke-width="1" stroke-dasharray="5 5" opacity="0.65"/>

      <g>
        <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="1.4s" repeatCount="indefinite"/>
        <path d="M -5 -32 L 5 -32 L 8 -8 L -8 -8 Z" fill="#E5EE4E"/>
        <path d="M -5 32 L 5 32 L 8 8 L -8 8 Z" fill="#ECBDD8"/>
        <path d="M -32 -5 L -32 5 L -8 8 L -8 -8 Z" fill="#A21517"/>
        <path d="M 32 -5 L 32 5 L 8 8 L 8 -8 Z" fill="#E5EE4E"/>
        <circle cx="0" cy="0" r="10" fill="#0A0A0A" stroke="#FFFFFF" stroke-width="2"/>
        <circle cx="0" cy="0" r="3.5" fill="#E5EE4E"/>
      </g>
    </g>

    <text x="77" y="160" text-anchor="middle" class="mono" font-size="10.5" font-weight="700" fill="#E5EE4E">1,850 RPM</text>
    <text x="77" y="174" text-anchor="middle" class="mono" font-size="8.5" fill="#A0A0A8">ROTATION: CW</text>
  </g>

  <!-- Footer Telemetry Bar (Separate text nodes) -->
  <rect x="16" y="262" width="548" height="30" rx="6" fill="#120E10" stroke="#33181C" stroke-width="1"/>
  <text x="28"  y="281" class="mono" font-size="10" fill="#A0A0A8">LOGIC:</text>
  <text x="72"  y="281" class="mono" font-size="10" font-weight="700" fill="#E5EE4E">5V</text>
  <text x="102" y="281" class="mono" font-size="10" fill="#555560">|</text>
  <text x="120" y="281" class="mono" font-size="10" fill="#A0A0A8">SWITCH:</text>
  <text x="170" y="281" class="mono" font-size="10" font-weight="700" fill="#ECBDD8">SPDT RELAY</text>
  <text x="256" y="281" class="mono" font-size="10" fill="#555560">|</text>
  <text x="274" y="281" class="mono" font-size="10" fill="#A0A0A8">OUTPUT:</text>
  <text x="326" y="281" class="mono" font-size="10" font-weight="700" fill="#FFFFFF">MOTOR RUNNING</text>
</svg>
