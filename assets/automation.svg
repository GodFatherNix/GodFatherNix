<style>
  .k{font:700 15px ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', 'Courier New', monospace;letter-spacing:5px;fill:#E5EE4E}
  .h{font:800 40px -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;letter-spacing:1px;fill:#fff}
  .s{font:600 14px ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', 'Courier New', monospace;letter-spacing:2px;fill:#ECBDD8}
  .p{font:700 15px ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', 'Courier New', monospace;letter-spacing:2px}
  .c{font:700 14px ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', 'Courier New', monospace;letter-spacing:2px}
  .m{font:700 12px ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', 'Courier New', monospace;letter-spacing:1.5px}
  .w{font:700 12px ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', 'Courier New', monospace;letter-spacing:1.5px;fill:#9da0ab}
  .live{opacity:0;animation:live 4s linear infinite}
  .idle{animation:idle 4s linear infinite}
  @keyframes live{0%,49.99%{opacity:1}50%,100%{opacity:0}}
  @keyframes idle{0%,49.99%{opacity:0}50%,100%{opacity:1}}
  .blink{animation:blink .36s steps(1) infinite}
  @keyframes blink{0%{opacity:1}50%{opacity:.2}}
  .flow{fill:none;stroke:#E5EE4E;stroke-width:3;stroke-linecap:round;stroke-dasharray:5 13;animation:flow .6s linear infinite}
  @keyframes flow{to{stroke-dashoffset:-18}}
  .silk{font:700 11px ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', 'Courier New', monospace;letter-spacing:2px;fill:#7b7e8a}
  .chip{font:800 15px -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;letter-spacing:2px;fill:#c8f6fa}
  .relay{font:800 17px -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;letter-spacing:2px;fill:#fff}
  .relay2{font:700 10px ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', 'Courier New', monospace;letter-spacing:1px;fill:#d6e8ff}</style>
