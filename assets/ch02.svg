<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 115" width="100%" role="img" aria-label="Chapter 02 — THE BUILDS: circuits that actually run">
  <defs>
    <linearGradient id="chBg2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#14090B"/>
      <stop offset="50%" stop-color="#0A0A0A"/>
      <stop offset="100%" stop-color="#120C0F"/>
    </linearGradient>

    <filter id="glow2" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <style>
      .mono { font-family: 'JetBrains Mono', 'Fira Code', 'DejaVu Sans Mono', Consolas, 'Courier New', monospace; }
      .sans { font-family: 'Segoe UI', 'DejaVu Sans', Arial, Helvetica, sans-serif; }

      .pulse-line {
        stroke-dasharray: 90 1110;
        animation: lineRun2 3s linear infinite;
      }
      @keyframes lineRun2 {
        from { stroke-dashoffset: 1200; }
        to { stroke-dashoffset: 0; }
      }

      .logic-flow-a {
        stroke-dasharray: 45 20;
        animation: lFlow 1.8s linear infinite;
      }
      .logic-flow-b {
        stroke-dasharray: 32 16;
        animation: lFlow 1.4s linear infinite;
      }
      @keyframes lFlow {
        from { stroke-dashoffset: 130; }
        to { stroke-dashoffset: 0; }
      }

      .led-ok { animation: okBlink 1.5s ease-in-out infinite; }
      @keyframes okBlink {
        0%, 100% { opacity: 0.45; }
        50% { opacity: 1; }
      }
    </style>
  </defs>

  <rect x="6" y="6" width="1188" height="103" rx="12" fill="url(#chBg2)" stroke="#381A1E" stroke-width="1.5"/>

  <!-- Left Chapter Badge -->
  <g transform="translate(24, 21)">
    <rect x="0" y="0" width="72" height="72" rx="10" fill="#A21517"/>
    <circle cx="36" cy="36" r="29" fill="none" stroke="#E5EE4E" stroke-width="1" stroke-dasharray="10 6" opacity="0.75">
      <animateTransform attributeName="transform" type="rotate" from="360 36 36" to="0 36 36" dur="12s" repeatCount="indefinite"/>
    </circle>
    <text x="36" y="47" text-anchor="middle" class="mono" font-size="30" font-weight="800" fill="#FFFFFF">02</text>
  </g>

  <path d="M 96 57 L 124 57 L 136 45 L 152 45" fill="none" stroke="#A21517" stroke-width="2"/>
  <circle cx="152" cy="45" r="3.5" fill="#ECBDD8" filter="url(#glow2)"/>

  <!-- Titles -->
  <g transform="translate(174, 42)">
    <text x="0" y="0" class="mono" font-size="11.5" fill="#ECBDD8" letter-spacing="1.8">CHAPTER 02 // HARDWARE LOG</text>
    <text x="0" y="30" class="sans" font-size="25" font-weight="800" fill="#FFFFFF" letter-spacing="0.6">THE BUILDS</text>
    <text x="310" y="29" class="mono" font-size="13" fill="#A0A0A8" letter-spacing="0.3">// circuits that actually run</text>
  </g>

  <!-- Right Side: Animated Logic Analyzer (Explicit L commands) -->
  <g transform="translate(910, 18)">
    <rect x="0" y="0" width="264" height="78" rx="8" fill="#0F0F13" stroke="#2D1E22" stroke-width="1.2"/>
    <text x="12" y="18" class="mono" font-size="9.5" fill="#A0A0A8">LOGIC_ANALYZER</text>
    <text x="252" y="18" text-anchor="end" class="mono led-ok" font-size="9.5" font-weight="700" fill="#E5EE4E">● TEST: PASS</text>

    <!-- D0 Trace -->
    <text x="12" y="36" class="mono" font-size="9" fill="#ECBDD8">D0</text>
    <path d="M 34 36 L 54 36 L 54 25 L 84 25 L 84 36 L 114 36 L 114 25 L 144 25 L 144 36 L 174 36 L 174 25 L 204 25 L 204 36 L 250 36" fill="none" stroke="#36222B" stroke-width="1.6"/>
    <path d="M 34 36 L 54 36 L 54 25 L 84 25 L 84 36 L 114 36 L 114 25 L 144 25 L 144 36 L 174 36 L 174 25 L 204 25 L 204 36 L 250 36" fill="none" stroke="#ECBDD8" stroke-width="1.8" class="logic-flow-a"/>

    <!-- D1 Trace -->
    <text x="12" y="52" class="mono" font-size="9" fill="#E5EE4E">D1</text>
    <path d="M 34 52 L 44 52 L 44 41 L 68 41 L 68 52 L 92 52 L 92 41 L 126 41 L 126 52 L 150 52 L 150 41 L 184 41 L 184 52 L 218 52 L 218 41 L 250 41" fill="none" stroke="#383A1B" stroke-width="1.6"/>
    <path d="M 34 52 L 44 52 L 44 41 L 68 41 L 68 52 L 92 52 L 92 41 L 126 41 L 126 52 L 150 52 L 150 41 L 184 41 L 184 52 L 218 52 L 218 41 L 250 41" fill="none" stroke="#E5EE4E" stroke-width="1.8" class="logic-flow-b"/>

    <!-- D2 Trace -->
    <text x="12" y="68" class="mono" font-size="9" fill="#D92628">D2</text>
    <path d="M 34 68 L 64 68 L 64 57 L 104 57 L 104 68 L 134 68 L 134 57 L 164 57 L 164 68 L 214 68 L 214 57 L 250 57" fill="none" stroke="#3D191D" stroke-width="1.6"/>
    <path d="M 34 68 L 64 68 L 64 57 L 104 57 L 104 68 L 134 68 L 134 57 L 164 57 L 164 68 L 214 68 L 214 57 L 250 57" fill="none" stroke="#D92628" stroke-width="1.8" class="logic-flow-a"/>
  </g>

  <!-- Bottom Animated Signal Line -->
  <line x1="24" y1="103" x2="1176" y2="103" stroke="#30181B" stroke-width="2"/>
  <line x1="24" y1="103" x2="1176" y2="103" stroke="#ECBDD8" stroke-width="2.4" class="pulse-line" filter="url(#glow2)"/>
</svg>
