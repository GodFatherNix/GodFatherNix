<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" role="img" aria-label="Kanishk — GodFatherNix — Electronics, Embedded Systems, and PCB Design">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A0A0A"/>
      <stop offset="55%" stop-color="#12090B"/>
      <stop offset="100%" stop-color="#0A0A0A"/>
    </linearGradient>

    <radialGradient id="crimsonGlow" cx="78%" cy="50%" r="42%">
      <stop offset="0%" stop-color="#A21517" stop-opacity="0.38"/>
      <stop offset="55%" stop-color="#A21517" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#0A0A0A" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="pinkGlow" cx="22%" cy="46%" r="40%">
      <stop offset="0%" stop-color="#ECBDD8" stop-opacity="0.11"/>
      <stop offset="100%" stop-color="#0A0A0A" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="scanSweep" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ECBDD8" stop-opacity="0"/>
      <stop offset="50%" stop-color="#ECBDD8" stop-opacity="0.09"/>
      <stop offset="85%" stop-color="#E5EE4E" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#E5EE4E" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="chipBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E1E24"/>
      <stop offset="100%" stop-color="#0E0E12"/>
    </linearGradient>

    <linearGradient id="accentRule" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#A21517"/>
      <stop offset="50%" stop-color="#ECBDD8"/>
      <stop offset="100%" stop-color="#E5EE4E"/>
    </linearGradient>

    <pattern id="pcbGrid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 L 0 30" fill="none" stroke="#18181E" stroke-width="0.8"/>
      <circle cx="0" cy="0" r="1" fill="#35191C"/>
    </pattern>

    <filter id="glowSoft" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <style>
      .mono { font-family: 'JetBrains Mono', 'Fira Code', 'DejaVu Sans Mono', Consolas, 'Courier New', monospace; }
      .sans { font-family: 'Segoe UI', 'DejaVu Sans', Arial, Helvetica, sans-serif; }

      .trace-flow-1 {
        stroke-dasharray: 32 190;
        animation: flow1 3.2s linear infinite;
      }
      .trace-flow-2 {
        stroke-dasharray: 24 150;
        animation: flow2 2.5s linear infinite;
      }
      .trace-flow-3 {
        stroke-dasharray: 38 220;
        animation: flow3 3.9s linear infinite;
      }
      .trace-flow-rev {
        stroke-dasharray: 26 160;
        animation: flowRev 2.9s linear infinite;
      }

      @keyframes flow1 {
        from { stroke-dashoffset: 222; }
        to { stroke-dashoffset: 0; }
      }
      @keyframes flow2 {
        from { stroke-dashoffset: 174; }
        to { stroke-dashoffset: 0; }
      }
      @keyframes flow3 {
        from { stroke-dashoffset: 258; }
        to { stroke-dashoffset: 0; }
      }
      @keyframes flowRev {
        from { stroke-dashoffset: 0; }
        to { stroke-dashoffset: 186; }
      }

      .scanline {
        animation: scanMove 6.5s ease-in-out infinite;
      }
      @keyframes scanMove {
        0% { transform: translateX(12px); opacity: 0; }
        12% { opacity: 1; }
        88% { opacity: 1; }
        100% { transform: translateX(1030px); opacity: 0; }
      }

      .led-blink-fast {
        animation: ledBlink 1.1s steps(2, end) infinite;
      }
      .led-blink-slow {
        animation: ledPulse 2.4s ease-in-out infinite;
      }
      @keyframes ledBlink {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.25; }
      }
      @keyframes ledPulse {
        0%, 100% { opacity: 0.35; }
        50% { opacity: 1; }
      }

      .glitch-red {
        opacity: 0;
        animation: glitchR 5.5s infinite;
      }
      .glitch-pink {
        opacity: 0;
        animation: glitchP 5.5s infinite;
      }
      @keyframes glitchR {
        0%, 91%, 100% { transform: translate(0, 0); opacity: 0; }
        92% { transform: translate(-4px, 1px); opacity: 0.85; }
        94% { transform: translate(3px, -1px); opacity: 0.65; }
        96% { transform: translate(-2px, 0); opacity: 0.75; }
        97% { transform: translate(0, 0); opacity: 0; }
      }
      @keyframes glitchP {
        0%, 91%, 100% { transform: translate(0, 0); opacity: 0; }
        92% { transform: translate(4px, -1px); opacity: 0.85; }
        94% { transform: translate(-3px, 1px); opacity: 0.65; }
        96% { transform: translate(2px, 0); opacity: 0.75; }
        97% { transform: translate(0, 0); opacity: 0; }
      }

      .scope-wave {
        stroke-dasharray: 420;
        stroke-dashoffset: 420;
        animation: scopeDraw 3.2s linear infinite;
      }
      @keyframes scopeDraw {
        0% { stroke-dashoffset: 420; opacity: 0.35; }
        20% { opacity: 1; }
        85% { stroke-dashoffset: 0; opacity: 1; }
        100% { stroke-dashoffset: -140; opacity: 0.35; }
      }

      .core-pulse {
        animation: coreBeat 2.2s ease-in-out infinite;
      }
      @keyframes coreBeat {
        0%, 100% { opacity: 0.55; }
        50% { opacity: 1; }
      }
    </style>
  </defs>

  <!-- Outer Frame -->
  <rect x="6" y="6" width="1188" height="408" rx="16" fill="url(#bgGrad)" stroke="#A21517" stroke-width="2"/>
  <rect x="8" y="8" width="1184" height="404" rx="15" fill="url(#pcbGrid)"/>
  <rect x="8" y="8" width="1184" height="404" rx="15" fill="url(#crimsonGlow)"/>
  <rect x="8" y="8" width="1184" height="404" rx="15" fill="url(#pinkGlow)"/>

  <!-- Background Copper PCB Traces (Explicit L commands) -->
  <g fill="none" stroke="#3B191D" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 60 88 L 240 88 L 275 123 L 440 123"/>
    <path d="M 60 332 L 320 332 L 358 294 L 620 294 L 665 249 L 800 249"/>
    <path d="M 995 110 L 1075 110 L 1115 70 L 1170 70"/>
    <path d="M 1015 155 L 1120 155 L 1150 185 L 1185 185"/>
    <path d="M 1015 265 L 1105 265 L 1145 305 L 1185 305"/>
    <path d="M 995 310 L 1060 310 L 1105 355 L 1170 355"/>
    <path d="M 855 110 L 855 55 L 820 20 L 540 20"/>
    <path d="M 915 320 L 915 375 L 880 402"/>
    <path d="M 760 165 L 650 165 L 615 130 L 520 130"/>
    <path d="M 760 215 L 635 215 L 605 245 L 540 245"/>
  </g>

  <!-- Animated Signal Pulses along Copper Traces -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round" filter="url(#glowSoft)">
    <path d="M 60 88 L 240 88 L 275 123 L 440 123" stroke="#ECBDD8" stroke-width="2.2" class="trace-flow-1"/>
    <path d="M 60 332 L 320 332 L 358 294 L 620 294 L 665 249 L 800 249" stroke="#E5EE4E" stroke-width="2.4" class="trace-flow-3"/>
    <path d="M 995 110 L 1075 110 L 1115 70 L 1170 70" stroke="#E5EE4E" stroke-width="2.2" class="trace-flow-2"/>
    <path d="M 1015 155 L 1120 155 L 1150 185 L 1185 185" stroke="#ECBDD8" stroke-width="2" class="trace-flow-1"/>
    <path d="M 1015 265 L 1105 265 L 1145 305 L 1185 305" stroke="#A21517" stroke-width="2.5" class="trace-flow-2"/>
    <path d="M 995 310 L 1060 310 L 1105 355 L 1170 355" stroke="#ECBDD8" stroke-width="2" class="trace-flow-3"/>
    <path d="M 855 110 L 855 55 L 820 20 L 540 20" stroke="#D92628" stroke-width="2.4" class="trace-flow-rev"/>
    <path d="M 760 165 L 650 165 L 615 130 L 520 130" stroke="#E5EE4E" stroke-width="2" class="trace-flow-rev"/>
    <path d="M 760 215 L 635 215 L 605 245 L 540 245" stroke="#ECBDD8" stroke-width="2" class="trace-flow-2"/>
  </g>

  <!-- Solder Vias & Pads -->
  <g>
    <circle cx="240" cy="88" r="4.5" fill="#0A0A0A" stroke="#ECBDD8" stroke-width="1.6"/>
    <circle cx="440" cy="123" r="4.5" fill="#0A0A0A" stroke="#A21517" stroke-width="1.6"/>
    <circle cx="520" cy="130" r="4.5" fill="#0A0A0A" stroke="#E5EE4E" stroke-width="1.6"/>
    <circle cx="540" cy="245" r="4.5" fill="#0A0A0A" stroke="#ECBDD8" stroke-width="1.6"/>
    <circle cx="620" cy="294" r="5" fill="#0A0A0A" stroke="#E5EE4E" stroke-width="1.6"/>
    <circle cx="540" cy="20" r="4.5" fill="#0A0A0A" stroke="#A21517" stroke-width="1.6"/>
    <circle cx="1075" cy="110" r="4.5" fill="#0A0A0A" stroke="#E5EE4E" stroke-width="1.6"/>
    <circle cx="1105" cy="265" r="4.5" fill="#0A0A0A" stroke="#A21517" stroke-width="1.6"/>
  </g>

  <!-- RIGHT SIDE: Animated MCU / Microcontroller Package (Centered at 910, 210) -->
  <g transform="translate(910, 210)">
    <!-- Rotating Outer Radar Ring -->
    <circle cx="0" cy="0" r="144" fill="none" stroke="#A21517" stroke-width="1.2" stroke-dasharray="14 8 4 8" opacity="0.65">
      <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="22s" repeatCount="indefinite"/>
    </circle>
    <circle cx="0" cy="0" r="126" fill="none" stroke="#ECBDD8" stroke-width="1" stroke-dasharray="4 10" opacity="0.5">
      <animateTransform attributeName="transform" type="rotate" from="360 0 0" to="0 0 0" dur="16s" repeatCount="indefinite"/>
    </circle>

    <!-- IC Pins -->
    <g fill="#E5EE4E" opacity="0.9">
      <rect x="-58" y="-96" width="8" height="16" rx="1.5"/>
      <rect x="-40" y="-96" width="8" height="16" rx="1.5"/>
      <rect x="-22" y="-96" width="8" height="16" rx="1.5"/>
      <rect x="-4"  y="-96" width="8" height="16" rx="1.5"/>
      <rect x="14"  y="-96" width="8" height="16" rx="1.5"/>
      <rect x="32"  y="-96" width="8" height="16" rx="1.5"/>
      <rect x="50"  y="-96" width="8" height="16" rx="1.5"/>

      <rect x="-58" y="80" width="8" height="16" rx="1.5"/>
      <rect x="-40" y="80" width="8" height="16" rx="1.5"/>
      <rect x="-22" y="80" width="8" height="16" rx="1.5"/>
      <rect x="-4"  y="80" width="8" height="16" rx="1.5"/>
      <rect x="14"  y="80" width="8" height="16" rx="1.5"/>
      <rect x="32"  y="80" width="8" height="16" rx="1.5"/>
      <rect x="50"  y="80" width="8" height="16" rx="1.5"/>

      <rect x="-96" y="-58" width="16" height="8" rx="1.5"/>
      <rect x="-96" y="-40" width="16" height="8" rx="1.5"/>
      <rect x="-96" y="-22" width="16" height="8" rx="1.5"/>
      <rect x="-96" y="-4"  width="16" height="8" rx="1.5"/>
      <rect x="-96" y="14"  width="16" height="8" rx="1.5"/>
      <rect x="-96" y="32"  width="16" height="8" rx="1.5"/>
      <rect x="-96" y="50"  width="16" height="8" rx="1.5"/>

      <rect x="80" y="-58" width="16" height="8" rx="1.5"/>
      <rect x="80" y="-40" width="16" height="8" rx="1.5"/>
      <rect x="80" y="-22" width="16" height="8" rx="1.5"/>
      <rect x="80" y="-4"  width="16" height="8" rx="1.5"/>
      <rect x="80" y="14"  width="16" height="8" rx="1.5"/>
      <rect x="80" y="32"  width="16" height="8" rx="1.5"/>
      <rect x="80" y="50"  width="16" height="8" rx="1.5"/>
    </g>

    <!-- Chip Package Body -->
    <rect x="-80" y="-80" width="160" height="160" rx="12" fill="url(#chipBody)" stroke="#A21517" stroke-width="2.2"/>
    <rect x="-70" y="-70" width="140" height="140" rx="8" fill="none" stroke="#30303A" stroke-width="1"/>
    <circle cx="-58" cy="-58" r="4.5" fill="#ECBDD8"/>

    <!-- Silicon Die Core Window -->
    <rect x="-38" y="-38" width="76" height="76" rx="6" fill="#0B0B0E" stroke="#ECBDD8" stroke-width="1.3" opacity="0.95"/>
    <g class="core-pulse" filter="url(#glowSoft)">
      <rect x="-24" y="-24" width="48" height="48" rx="4" fill="#A21517" fill-opacity="0.32" stroke="#E5EE4E" stroke-width="1.4"/>
      <path d="M -16 0 L 16 0 M 0 -16 L 0 16 M -11 -11 L 11 11 M -11 11 L 11 -11" stroke="#ECBDD8" stroke-width="1.2" opacity="0.9"/>
      <circle cx="0" cy="0" r="6" fill="#E5EE4E"/>
    </g>

    <!-- Silkscreen Labels on Chip -->
    <text x="0" y="-50" text-anchor="middle" class="mono" font-size="9.5" fill="#A0A0A8" letter-spacing="1">NIX-MCU // 328P</text>
    <text x="0" y="58" text-anchor="middle" class="mono" font-size="9" fill="#ECBDD8" letter-spacing="1">CLK 16.000 MHz</text>

    <!-- Chip Status LEDs -->
    <circle cx="54" cy="-58" r="3.2" fill="#E5EE4E" class="led-blink-fast" filter="url(#glowSoft)"/>
    <circle cx="42" cy="-58" r="3.2" fill="#A21517" class="led-blink-slow" filter="url(#glowSoft)"/>
  </g>

  <!-- LEFT SIDE: HUD Typography & Telemetry -->
  <g transform="translate(56, 54)">
    <!-- Top Telemetry Pill -->
    <rect x="0" y="0" width="388" height="28" rx="6" fill="#141013" stroke="#A21517" stroke-width="1.2"/>
    <circle cx="16" cy="14" r="4.2" fill="#E5EE4E" class="led-blink-fast" filter="url(#glowSoft)"/>
    <text x="30" y="18.5" class="mono" font-size="11.5" fill="#ECBDD8" letter-spacing="1.2">SYS.ONLINE // LAB_01 // PCB_REV_2.6</text>

    <!-- Hero Title with Glitch Layers -->
    <g transform="translate(0, 104)">
      <text x="0" y="0" class="sans glitch-red" font-size="70" font-weight="900" fill="#A21517" letter-spacing="2.5">KANISHK</text>
      <text x="0" y="0" class="sans glitch-pink" font-size="70" font-weight="900" fill="#ECBDD8" letter-spacing="2.5">KANISHK</text>
      <text x="0" y="0" class="sans" font-size="70" font-weight="900" fill="#FFFFFF" letter-spacing="2.5">KANISHK</text>
    </g>

    <!-- Handle & Role Bar -->
    <g transform="translate(2, 142)">
      <rect x="0" y="-18" width="182" height="28" rx="5" fill="#A21517"/>
      <text x="91" y="1" text-anchor="middle" class="mono" font-size="14" font-weight="700" fill="#FFFFFF" letter-spacing="1">@GodFatherNix</text>
      <text x="198" y="1" class="mono" font-size="14" fill="#E5EE4E" letter-spacing="1">// BUILD · TEST · RUN</text>
    </g>

    <!-- Discipline Subtitle -->
    <text x="2" y="186" class="mono" font-size="13.5" fill="#ECBDD8" letter-spacing="1.6">ELECTRONICS · EMBEDDED SYSTEMS · PCB DESIGN</text>
    <rect x="2" y="201" width="520" height="2.2" fill="url(#accentRule)" opacity="0.9"/>

    <!-- Mini Live Oscilloscope Box -->
    <g transform="translate(0, 222)">
      <rect x="0" y="0" width="520" height="84" rx="8" fill="#0D0D11" stroke="#301E23" stroke-width="1.3"/>
      <line x1="12" y1="42" x2="508" y2="42" stroke="#1E1E26" stroke-width="1" stroke-dasharray="4 4"/>
      <line x1="175" y1="8" x2="175" y2="76" stroke="#1E1E26" stroke-width="1" stroke-dasharray="4 4"/>
      <line x1="345" y1="8" x2="345" y2="76" stroke="#1E1E26" stroke-width="1" stroke-dasharray="4 4"/>

      <!-- Static Ghost Trace -->
      <path d="M 16 56 L 48 56 L 48 26 L 88 26 L 88 56 L 128 56 L 128 26 L 168 26 L 168 56 L 208 56 L 208 26 L 248 26 L 248 56 L 288 56 L 288 26 L 328 26 L 328 56 L 368 56 L 368 26 L 408 26 L 408 56 L 448 56 L 448 26 L 500 26"
            fill="none" stroke="#38181B" stroke-width="2"/>
      <!-- Animated Live Square Wave -->
      <path d="M 16 56 L 48 56 L 48 26 L 88 26 L 88 56 L 128 56 L 128 26 L 168 26 L 168 56 L 208 56 L 208 26 L 248 26 L 248 56 L 288 56 L 288 26 L 328 26 L 328 56 L 368 56 L 368 26 L 408 26 L 408 56 L 448 56 L 448 26 L 500 26"
            fill="none" stroke="#E5EE4E" stroke-width="2.2" class="scope-wave" filter="url(#glowSoft)"/>

      <!-- Sine Carrier Overlay -->
      <path d="M 16 42 Q 44 14, 72 42 T 128 42 T 184 42 T 240 42 T 296 42 T 352 42 T 408 42 T 464 42"
            fill="none" stroke="#ECBDD8" stroke-width="1.4" opacity="0.65"/>

      <text x="14" y="17" class="mono" font-size="9.5" fill="#A0A0A8">CH1: PWM 5.0V</text>
      <text x="504" y="17" text-anchor="end" class="mono" font-size="9.5" fill="#E5EE4E">TRIG: AUTO [RUN]</text>
      <text x="14" y="74" class="mono" font-size="9.5" fill="#ECBDD8">STATUS: CIRCUIT VERIFIED</text>
      <text x="504" y="74" text-anchor="end" class="mono" font-size="9.5" fill="#A0A0A8">10us / DIV</text>
    </g>
  </g>

  <!-- Floating Telemetry Corner Labels -->
  <text x="1166" y="34" text-anchor="end" class="mono" font-size="10.5" fill="#A0A0A8" letter-spacing="1">VCC: +5.02V  |  GND: 0.00V</text>
  <text x="1166" y="392" text-anchor="end" class="mono" font-size="10.5" fill="#ECBDD8" letter-spacing="1">GPIO_ALL: READY  ●  2026</text>

  <!-- HUD Corner Brackets -->
  <g fill="none" stroke="#E5EE4E" stroke-width="2.2">
    <path d="M 20 42 L 20 20 L 42 20"/>
    <path d="M 1158 20 L 1180 20 L 1180 42"/>
    <path d="M 20 378 L 20 400 L 42 400"/>
    <path d="M 1158 400 L 1180 400 L 1180 378"/>
  </g>

  <!-- Cinematic Vertical Radar Sweep (stays cleanly inside frame) -->
  <rect x="0" y="10" width="140" height="400" fill="url(#scanSweep)" opacity="0" class="scanline"/>
</svg>
