<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 115" width="100%" role="img" aria-label="Chapter 03 — THE ARSENAL: tools, languages, and software">
  <defs>
    <linearGradient id="chBg3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#14090B"/>
      <stop offset="50%" stop-color="#0A0A0A"/>
      <stop offset="100%" stop-color="#120C0F"/>
    </linearGradient>

    <filter id="glow3" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <style>
      .mono { font-family: 'JetBrains Mono', 'Fira Code', 'DejaVu Sans Mono', Consolas, 'Courier New', monospace; }
      .sans { font-family: 'Segoe UI', 'DejaVu Sans', Arial, Helvetica, sans-serif; }

      .pulse-line {
        stroke-dasharray: 85 1115;
        animation: lineRun3 3.3s linear infinite;
      }
      @keyframes lineRun3 {
        from { stroke-dashoffset: 1200; }
        to { stroke-dashoffset: 0; }
      }

      .pin-scan-1 { animation: pScan 1.8s ease-in-out 0s infinite; }
      .pin-scan-2 { animation: pScan 1.8s ease-in-out 0.3s infinite; }
      .pin-scan-3 { animation: pScan 1.8s ease-in-out 0.6s infinite; }
      .pin-scan-4 { animation: pScan 1.8s ease-in-out 0.9s infinite; }
      @keyframes pScan {
        0%, 100% { fill: #45262B; }
        45% { fill: #E5EE4E; }
      }

      .drc-blink { animation: drcB 2.2s ease-in-out infinite; }
      @keyframes drcB {
        0%, 100% { opacity: 0.45; }
        50% { opacity: 1; }
      }
    </style>
  </defs>

  <rect x="6" y="6" width="1188" height="103" rx="12" fill="url(#chBg3)" stroke="#381A1E" stroke-width="1.5"/>

  <!-- Left Chapter Badge -->
  <g transform="translate(24, 21)">
    <rect x="0" y="0" width="72" height="72" rx="10" fill="#A21517"/>
    <circle cx="36" cy="36" r="29" fill="none" stroke="#ECBDD8" stroke-width="1" stroke-dasharray="3 7" opacity="0.75">
      <animateTransform attributeName="transform" type="rotate" from="0 36 36" to="360 36 36" dur="18s" repeatCount="indefinite"/>
    </circle>
    <text x="36" y="47" text-anchor="middle" class="mono" font-size="30" font-weight="800" fill="#FFFFFF">03</text>
  </g>

  <path d="M 96 57 L 124 57 L 136 45 L 152 45" fill="none" stroke="#A21517" stroke-width="2"/>
  <circle cx="152" cy="45" r="3.5" fill="#E5EE4E" filter="url(#glow3)"/>

  <!-- Titles -->
  <g transform="translate(174, 42)">
    <text x="0" y="0" class="mono" font-size="11.5" fill="#ECBDD8" letter-spacing="1.8">CHAPTER 03 // TECH STACK</text>
    <text x="0" y="30" class="sans" font-size="25" font-weight="800" fill="#FFFFFF" letter-spacing="0.6">THE ARSENAL</text>
    <text x="330" y="29" class="mono" font-size="13" fill="#A0A0A8" letter-spacing="0.3">// tools · languages · software</text>
  </g>

  <!-- Right Side: Animated SMD Chip Footprint -->
  <g transform="translate(932, 18)">
    <rect x="0" y="0" width="242" height="78" rx="8" fill="#0F0F13" stroke="#2D1E22" stroke-width="1.2"/>

    <g transform="translate(22, 17)">
      <rect x="10" y="8" width="42" height="28" rx="4" fill="#18181F" stroke="#A21517" stroke-width="1.5"/>
      <text x="31" y="25" text-anchor="middle" class="mono" font-size="8.5" fill="#ECBDD8">EDA</text>
      <rect x="15" y="1" width="5" height="7" rx="1" fill="#45262B" class="pin-scan-1"/>
      <rect x="24" y="1" width="5" height="7" rx="1" fill="#45262B" class="pin-scan-2"/>
      <rect x="33" y="1" width="5" height="7" rx="1" fill="#45262B" class="pin-scan-3"/>
      <rect x="42" y="1" width="5" height="7" rx="1" fill="#45262B" class="pin-scan-4"/>
      <rect x="15" y="36" width="5" height="7" rx="1" fill="#45262B" class="pin-scan-4"/>
      <rect x="24" y="36" width="5" height="7" rx="1" fill="#45262B" class="pin-scan-3"/>
      <rect x="33" y="36" width="5" height="7" rx="1" fill="#45262B" class="pin-scan-2"/>
      <rect x="42" y="36" width="5" height="7" rx="1" fill="#45262B" class="pin-scan-1"/>
    </g>

    <text x="94" y="30" class="mono" font-size="10.5" fill="#A0A0A8" letter-spacing="0.8">CAD // FIRMWARE</text>
    <text x="94" y="49" class="mono" font-size="13.5" font-weight="700" fill="#FFFFFF">KiCad · EasyEDA</text>
    <text x="94" y="66" class="mono drc-blink" font-size="9.5" fill="#E5EE4E">● DRC: 0 ERRORS</text>
  </g>

  <!-- Bottom Animated Signal Line -->
  <line x1="24" y1="103" x2="1176" y2="103" stroke="#30181B" stroke-width="2"/>
  <line x1="24" y1="103" x2="1176" y2="103" stroke="#E5EE4E" stroke-width="2.4" class="pulse-line" filter="url(#glow3)"/>
</svg>
