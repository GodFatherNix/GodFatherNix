<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 175" width="100%" role="img" aria-label="Boot sequence: loading electronics, embedded systems and PCB design modules. Rule: if it doesn't run, I don't care.">
  <defs>
    <linearGradient id="termBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0B0D"/>
      <stop offset="100%" stop-color="#130A0C"/>
    </linearGradient>

    <linearGradient id="barGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#A21517"/>
      <stop offset="55%" stop-color="#ECBDD8"/>
      <stop offset="100%" stop-color="#E5EE4E"/>
    </linearGradient>

    <linearGradient id="ruleBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1B090B"/>
      <stop offset="100%" stop-color="#0E0B0D"/>
    </linearGradient>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <style>
      .mono { font-family: 'JetBrains Mono', 'Fira Code', 'DejaVu Sans Mono', Consolas, 'Courier New', monospace; }

      .cursor-blink {
        animation: cBlink 0.9s steps(2, end) infinite;
      }
      @keyframes cBlink {
        0%, 100% { opacity: 1; }
        50% { opacity: 0; }
      }

      .bar-1 { animation: load1 4.5s ease-in-out infinite; }
      .bar-2 { animation: load2 4.5s ease-in-out infinite; }
      .bar-3 { animation: load3 4.5s ease-in-out infinite; }

      @keyframes load1 {
        0%, 6% { width: 12px; }
        28%, 88% { width: 148px; }
        96%, 100% { width: 12px; }
      }
      @keyframes load2 {
        0%, 16% { width: 12px; }
        42%, 88% { width: 148px; }
        96%, 100% { width: 12px; }
      }
      @keyframes load3 {
        0%, 28% { width: 12px; }
        56%, 88% { width: 148px; }
        96%, 100% { width: 12px; }
      }

      .ok-1 { animation: okFade1 4.5s ease-in-out infinite; }
      .ok-2 { animation: okFade2 4.5s ease-in-out infinite; }
      .ok-3 { animation: okFade3 4.5s ease-in-out infinite; }
      @keyframes okFade1 {
        0%, 24% { opacity: 0.25; }
        30%, 88% { opacity: 1; }
        96%, 100% { opacity: 0.25; }
      }
      @keyframes okFade2 {
        0%, 38% { opacity: 0.25; }
        44%, 88% { opacity: 1; }
        96%, 100% { opacity: 0.25; }
      }
      @keyframes okFade3 {
        0%, 52% { opacity: 0.25; }
        58%, 88% { opacity: 1; }
        96%, 100% { opacity: 0.25; }
      }

      .ecg-line {
        stroke-dasharray: 220;
        stroke-dashoffset: 220;
        animation: ecgMove 2.4s linear infinite;
      }
      @keyframes ecgMove {
        0% { stroke-dashoffset: 220; opacity: 0.4; }
        20% { opacity: 1; }
        100% { stroke-dashoffset: -220; opacity: 0.4; }
      }
    </style>
  </defs>

  <!-- Outer Frame -->
  <rect x="6" y="6" width="1188" height="163" rx="12" fill="url(#termBg)" stroke="#A21517" stroke-width="1.8"/>

  <!-- Top Terminal Header Strip -->
  <rect x="7" y="7" width="1186" height="30" rx="10" fill="#151115"/>
  <line x1="6" y1="37" x2="1194" y2="37" stroke="#2D1518" stroke-width="1.2"/>

  <!-- Terminal Window Dots -->
  <circle cx="26" cy="22" r="5" fill="#A21517"/>
  <circle cx="44" cy="22" r="5" fill="#E5EE4E"/>
  <circle cx="62" cy="22" r="5" fill="#ECBDD8"/>
  <text x="84" y="26" class="mono" font-size="11.5" fill="#A0A0A8" letter-spacing="0.8">boot@godfathernix:~/workbench  —  UART 115200 8N1</text>
  <text x="1174" y="26" text-anchor="end" class="mono" font-size="11" fill="#E5EE4E" letter-spacing="0.8">● BOOTLOADER v2.6</text>

  <!-- LEFT: Sequential Boot Log & Animated Progress Bars -->
  <g transform="translate(26, 58)">
    <!-- Row 1 -->
    <text x="0" y="14" class="mono" font-size="13" fill="#A0A0A8">[0.004]</text>
    <text x="72" y="14" class="mono" font-size="13" fill="#ECBDD8">LOAD</text>
    <text x="118" y="14" class="mono" font-size="13" fill="#FFFFFF">electronics.mod</text>
    <rect x="298" y="3" width="152" height="13" rx="3" fill="#18181D" stroke="#2E2E36" stroke-width="1"/>
    <rect x="300" y="5" width="148" height="9" rx="2" fill="url(#barGrad)" class="bar-1"/>
    <text x="466" y="14" class="mono ok-1" font-size="12.5" font-weight="700" fill="#E5EE4E">[ OK ]</text>

    <!-- Row 2 -->
    <text x="0" y="45" class="mono" font-size="13" fill="#A0A0A8">[0.039]</text>
    <text x="72" y="45" class="mono" font-size="13" fill="#ECBDD8">INIT</text>
    <text x="118" y="45" class="mono" font-size="13" fill="#FFFFFF">embedded_sys.drv</text>
    <rect x="298" y="34" width="152" height="13" rx="3" fill="#18181D" stroke="#2E2E36" stroke-width="1"/>
    <rect x="300" y="36" width="148" height="9" rx="2" fill="url(#barGrad)" class="bar-2"/>
    <text x="466" y="45" class="mono ok-2" font-size="12.5" font-weight="700" fill="#E5EE4E">[ OK ]</text>

    <!-- Row 3 -->
    <text x="0" y="76" class="mono" font-size="13" fill="#A0A0A8">[0.092]</text>
    <text x="72" y="76" class="mono" font-size="13" fill="#ECBDD8">EXEC</text>
    <text x="118" y="76" class="mono" font-size="13" fill="#FFFFFF">pcb_design.drc</text>
    <rect x="298" y="65" width="152" height="13" rx="3" fill="#18181D" stroke="#2E2E36" stroke-width="1"/>
    <rect x="300" y="67" width="148" height="9" rx="2" fill="url(#barGrad)" class="bar-3"/>
    <text x="466" y="76" class="mono ok-3" font-size="12.5" font-weight="700" fill="#E5EE4E">[ OK ]</text>

    <!-- Prompt Line -->
    <text x="0" y="102" class="mono" font-size="12" fill="#D92628" font-weight="700">root@workbench:~#</text>
    <text x="142" y="102" class="mono" font-size="12" fill="#ECBDD8">./run_circuit --verify-hardware</text>
    <rect x="386" y="90" width="8" height="14" fill="#E5EE4E" class="cursor-blink"/>
  </g>

  <!-- Vertical Divider -->
  <line x1="576" y1="48" x2="576" y2="156" stroke="#36181B" stroke-width="1.5" stroke-dasharray="4 4"/>

  <!-- RIGHT: Core Workbench Rule Callout -->
  <g transform="translate(600, 49)">
    <rect x="0" y="0" width="572" height="106" rx="10" fill="url(#ruleBg)" stroke="#A21517" stroke-width="1.8"/>
    <rect x="0" y="14" width="5" height="78" rx="2.5" fill="#E5EE4E" filter="url(#softGlow)"/>

    <text x="24" y="26" class="mono" font-size="11.5" font-weight="700" fill="#E5EE4E" letter-spacing="1.2">⚡ CORE_DIRECTIVE // WORKBENCH RULE</text>
    <text x="24" y="60" class="mono" font-size="21.5" font-weight="700" fill="#FFFFFF">"If it doesn't run, I don't care."</text>

    <!-- Animated Heartbeat / Signal Pulse under quote -->
    <g transform="translate(24, 72)">
      <path d="M 0 15 L 95 15 L 106 3 L 118 25 L 130 8 L 140 15 L 360 15" fill="none" stroke="#3B1A1E" stroke-width="1.8"/>
      <path d="M 0 15 L 95 15 L 106 3 L 118 25 L 130 8 L 140 15 L 360 15" fill="none" stroke="#ECBDD8" stroke-width="2" class="ecg-line" filter="url(#softGlow)"/>
      <text x="380" y="19" class="mono" font-size="11" fill="#A0A0A8">STATUS:</text>
      <text x="442" y="19" class="mono" font-size="11" font-weight="700" fill="#E5EE4E">VERIFIED</text>
    </g>
  </g>
</svg>
