<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380">
<defs>
  <linearGradient id="bar" x1="0" x2="1"><stop offset="0" stop-color="#A21517"/><stop offset="1" stop-color="#E5EE4E"/></linearGradient>
</defs>
<style>
  .t{font:15px ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', 'Courier New', monospace;white-space:pre}
  .b{font-weight:700}
  .ln{opacity:0;animation:in .25s ease-out forwards}
  @keyframes in{from{opacity:0;transform:translateX(-12px)}to{opacity:1;transform:none}}
  .rule{opacity:0;animation:in .3s 4.4s forwards}
  .cur{animation:bl 1s 4.4s steps(1) infinite;opacity:0}
  @keyframes bl{0%{opacity:1}50%{opacity:0}}
  .win{animation:open .65s cubic-bezier(.2,.8,.2,1) both;transform-origin:600px 190px}
  @keyframes open{from{transform:scaleY(.04) scaleX(.75);opacity:0}55%{transform:scaleY(.04) scaleX(1);opacity:1}to{transform:none;opacity:1}}
</style>
<g class="win">
  <rect x="10" y="10" width="1180" height="360" rx="14" fill="#0c0d10" stroke="#A21517" stroke-width="2"/>
  <rect x="10" y="10" width="1180" height="42" rx="14" fill="#180708"/>
  <rect x="10" y="38" width="1180" height="14" fill="#180708"/>
  <circle cx="40" cy="31" r="7" fill="#A21517"/><circle cx="64" cy="31" r="7" fill="#E5EE4E"/><circle cx="88" cy="31" r="7" fill="#ECBDD8"/>
  <text x="600" y="36" text-anchor="middle" class="t b" fill="#c9d1d9">kanishk@workbench: ~/boot</text>
  <g>
    <g class="ln" style="animation-delay:0.4s"><text x="40" y="92" fill="#9a9aa2" class="t b"></text><text x="40" y="92" class="t" fill="#9a9aa2">KANISHK-OS v2.6 :: bootloader — press nothing, it's already running</text></g><g class="ln" style="animation-delay:0.9s"><text x="40" y="118" fill="#3fb950" class="t b">[ OK ]</text><text x="124" y="118" class="t" fill="#f0f3f6">Initializing power rails ............ 5V / 3V3 stable</text></g><g class="ln" style="animation-delay:1.4s"><text x="40" y="144" fill="#3fb950" class="t b">[ OK ]</text><text x="124" y="144" class="t" fill="#f0f3f6">Loading module: electronics.ko</text></g><g class="ln" style="animation-delay:1.9s"><text x="40" y="170" fill="#3fb950" class="t b">[ OK ]</text><text x="124" y="170" class="t" fill="#f0f3f6">Loading module: embedded_systems.ko</text></g><g class="ln" style="animation-delay:2.4s"><text x="40" y="196" fill="#3fb950" class="t b">[ OK ]</text><text x="124" y="196" class="t" fill="#f0f3f6">Loading module: pcb_design.ko (EasyEDA, KiCad)</text></g><g class="ln" style="animation-delay:2.9s"><text x="40" y="222" fill="#E5EE4E" class="t b">[ .. ]</text><text x="124" y="222" class="t" fill="#f0f3f6">Mounting /workbench ................. sensors, relays, motors</text></g><g class="ln" style="animation-delay:3.4s"><text x="40" y="248" fill="#ff7b39" class="t b">[WARN]</text><text x="124" y="248" class="t" fill="#f0f3f6">Circuit failed first test — debugging (as usual)</text></g><g class="ln" style="animation-delay:3.9s"><text x="40" y="274" fill="#3fb950" class="t b">[ OK ]</text><text x="124" y="274" class="t" fill="#f0f3f6">Circuit runs. Proceeding to the next build.</text></g>
    <g class="rule">
      <text x="40" y="312" class="t b" fill="#ECBDD8">&gt; rule:</text>
      <text x="124" y="312" class="t b" fill="#E5EE4E">"If it doesn't run, I don't care."</text>
      <rect x="448" y="297" width="10" height="18" fill="#E5EE4E" class="cur"/>
    </g>
    <rect x="800" y="296" width="350" height="12" rx="6" fill="#1d1f24"/>
    <rect x="800" y="296" width="0" height="12" rx="6" fill="url(#bar)"><animate attributeName="width" from="0" to="350" begin=".35s" dur="4s" fill="freeze"/></rect>
  </g>
</g>
</svg>